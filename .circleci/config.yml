version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Hadolint
          command: |
            curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
            chmod +x hadolint
      - run:
          name: Lint Dockerfile
          command: |
            echo "Running Hadolint on Dockerfile..."
            if ./hadolint --ignore DL4005 --ignore DL3008 Dockerfile; then
              echo "✅ Dockerfile passed linting!"
            else
              echo "❌ Dockerfile failed linting."
              exit 1
            fi

  build:
    machine: true
    steps:
      - checkout
      - run:
          name: Build an artifact
          command: ./build_push_image_karsajobs_ui.sh

workflows:
  karsajobs-ui:
    jobs:
      - lint:
          filters:
            branches:
              only:
                - karsajobs-ui
      - build:
          requires:
            - lint
          filters:
            branches:
              only:
                - karsajobs-ui
