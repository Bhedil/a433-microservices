version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Git Checkout Karsajobs
          command: pwd
      - run:
          name: Install Hadolint
          command: |
            curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
            chmod +x hadolint
      - run:
          name: Lint Dockerfile
          command: |
            pwd
            ./hadolint --ignore DL4005 --ignore DL3008 karsajobs/Dockerfile

  test:
    docker:
      - image: cimg/go:1.24.2
    steps:
      - checkout
      - run:
          name: Run tests
          command: go test -v -short --count=1 $(go list ./...)

  build:
    docker:
      - image: cimg/base:2021.04
    steps:
      - checkout
      - run:
          name: Build an artifact
          command: ./build_push_image_karsajobs.sh

workflows:
  karsajobs:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - build:
          requires:
            - test
